<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NXTCORE · дневник дней</title>
  <meta name="description" content="NXTCORE: дневник, в котором день из текста, фото и песни становится воспоминанием, на которое хочется смотреть.">
  <meta name="theme-color" content="#faf7f2">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;800&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <script>
    // тема ставится до первой отрисовки, чтобы не мигало
    try {
      var t = localStorage.getItem('nx_theme') || 'system';
      var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#view">К содержимому</a>
  <div id="app"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <noscript><p style="padding:2rem;font-family:sans-serif">Для работы NXTCORE нужен JavaScript.</p></noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
